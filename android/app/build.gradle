apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.vidfetch.downloader"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.vidfetch.downloader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ⚠️ versionCode MUST strictly increase for Android to install an
        // updated APK over an existing one. It was pinned at 1 through nine
        // releases (v1.8.0 → v2.3.1): users could not update in place
        // ("App not installed") and kept testing STALE builds — which is why
        // every previous fix appeared to "not work". CI stamps the real
        // code/name from the git tag (see build-apk.yml / release.yml);
        // these defaults only apply to bare local builds.
        versionCode 13
        versionName "2.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Ship only Turkish + English app resources — Capacitor pulls in
        // every locale of every AndroidX library otherwise (~1–2 MB saved).
        resourceConfigurations += ['en', 'tr']
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // ── ABI splits — HALVE the download size ─────────────────────
    // The bundled yt-dlp engine ships a Python + FFmpeg runtime per ABI
    // (~50 MB each). A universal APK packs FOUR copies (arm64, arm32, x86,
    // x86_64) ≈ 195 MB, so every user downloads all four but uses one.
    // With splits, each device downloads ONLY its own copy: the arm64 APK
    // (99% of phones) drops to roughly 90 MB — a much faster install.
    // versionCode gets *10 + abiIndex per split (see below) so codes stay
    // strictly increasing across releases and unique within one.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }
}

applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        if (abi != null) {
            def abiCode = abi == 'arm64-v8a' ? 1 : (abi == 'armeabi-v7a' ? 2 : 3)
            output.versionCodeOverride = variant.versionCode * 10 + abiCode
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // ─── yt-dlp Engine ────────────────────────────────────────────
    // Bundles Python 3.10 runtime + yt-dlp lazy extractors for Android ARM64
    // Published on Maven Central since v0.16.0: https://github.com/yausername/youtubedl-android
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'

    // Pre-compiled FFmpeg for merging video+audio streams
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    // ─── WorkManager (Foreground Service) ─────────────────────────
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // ─── Storage Access Framework (folder picker + DocumentFile) ───
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // ─── Lifecycle (for progress observers) ───────────────────────
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
