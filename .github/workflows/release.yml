# ──────────────────────────────────────────────────────────────────────
# VidFetch — Manual Release Builder
#
# Trigger manually from the Actions tab. Builds APK, creates a
# GitHub Release, and uploads the APK as a release asset.
#
# ⚠️ This workflow ONLY builds Android APK.
#    There is NO Windows EXE / Electron build in this project.
#
# Usage:
#   1. Go to Actions → "Release Builder" → Run workflow
#   2. Enter the version tag (e.g. v1.2.0)
#   3. The release is created with the APK attached
# ──────────────────────────────────────────────────────────────────────

name: Release Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.2.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Android APK ────────────────────────────────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "✅ APK found: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}

  # ── Create Release ─────────────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "VidFetch ${{ inputs.tag }}"
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            ./artifacts/**/*.apk
          body: |
            ## VidFetch ${{ inputs.tag }}

            ### 📥 Download
            Grab the Android APK below and install it on your device.

            ### What's new
            See the commit history for details.

            ### Requirements
            - Android 8.0 (API 26) or higher
            - ~50 MB free storage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
