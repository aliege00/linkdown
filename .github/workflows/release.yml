# ──────────────────────────────────────────────────────────────────────
# VidFetch — Release Builder
#
# Triggers:
#   • Push a version tag (v*)  → auto-build + auto-release
#   • Manual (workflow_dispatch) → build + release with custom options
#
# Builds BOTH deliverables:
#   • Android APK  (ubuntu-latest) — ONE universal APK, all ABIs
#   • Windows EXE  (windows-latest) — NSIS installer + portable, RAM-tuned
# ──────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.7.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Android APK ────────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Android SDK ────────────────────────────────────────────────
      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME is set). The android-actions/setup-android@v3 action
      # is currently broken (it tries to install the deprecated "tools"
      # package and fails sdkmanager), so we only accept licenses here.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      # ── Release signing keystore (from GitHub Secrets) ────────────
      # SIGNING_KEY is the base64-encoded .jks keystore; the passwords and
      # alias arrive as plain secrets. The decoded file stays in the runner
      # workspace and is never committed. Local builds skip this step and
      # fall back to the debug key (see android/app/build.gradle).
      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "❌ Signing secrets missing. Required: SIGNING_KEY (base64 keystore),"
            echo "   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD."
            echo "   See README.md → 'Release imzalama kurulumu' for the exact steps."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 --decode > android/app/release.keystore
          echo "SIGNING_STORE_FILE=$PWD/android/app/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
        
      # ── Stamp versionCode/versionName from the git tag ────────────
      # Android refuses to install an APK whose versionCode is not strictly
      # greater than the installed one. Derive an ever-increasing code from
      # the tag. Only stamp the defaultConfig line — there is no ABI-split
      # versionCode override anymore (single universal APK).
      - name: Stamp Android version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # versionCode: major*10000 + minor*100 + patch (v2.6.1 -> 20601)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i "s/versionCode [0-9][0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "Stamped versionCode=$CODE versionName=$VERSION"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build frontend
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # universalApk=true also emits per-ABI splits, but we ship ONLY the
      # universal APK: one file, installs on every device, zero confusion.
      # assembleRelease is SIGNED (signingConfig from the decoded keystore).
      - name: Build single universal release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Find APK
        id: apk
        run: |
          mkdir -p apk-out
          UNIVERSAL=$(ls android/app/build/outputs/apk/release/*universal*.apk 2>/dev/null | head -n 1)
          if [ -z "$UNIVERSAL" ]; then
            echo "❌ Universal release APK not found!"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$UNIVERSAL" apk-out/VidFetch.apk
          echo "Found: VidFetch.apk ($(du -h "$UNIVERSAL" | cut -f1))"
          echo "✅ Single universal SIGNED release APK ready (arm64 + arm32 + x86_64)"

      # ── SHA-256 checksum for the release notes ────────────────────
      # Users can verify the APK they downloaded matches the one CI built
      # (shasum -a 256 VidFetch-vX.Y.Z.apk). The value travels to the
      # publish job inside the uploaded artifact as SHA256.txt.
      - name: Compute APK SHA-256
        run: |
          SHA=$(sha256sum apk-out/VidFetch.apk | awk '{print $1}')
          echo "$SHA" > apk-out/SHA256.txt
          echo "SHA-256: $SHA"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            apk-out/*.apk
            apk-out/SHA256.txt

  # ── Windows EXE ─────────────────────────────────────────────────────
  # NSIS installer + portable EXE with the yt-dlp engine bundled. RAM is
  # kept low by electron/main.cjs flags (no GPU process, single instance,
  # capped V8 heap) — see electron-builder.yml for packaging choices.
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Download the yt-dlp engine for Windows ─────────────────────
      # yt-dlp.exe is a self-contained zipapp; ffmpeg is a static build.
      # Both live under native-tools/ and ship inside the EXE via
      # extraResources (electron-builder.yml). The optional bot-check
      # plugin directory is created empty when not committed to the repo.
      - name: Fetch yt-dlp + ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native-tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "native-tools/yt-dlp.exe"
          $ffmpegZip = "$env:RUNNER_TEMP/ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          Copy-Item "$env:RUNNER_TEMP/ffmpeg/ffmpeg-7.1-essentials_build/bin/ffmpeg.exe" "native-tools/ffmpeg.exe"
          if (-not (Test-Path "native-tools/yt-dlp-plugins")) {
            New-Item -ItemType Directory -Force -Path "native-tools/yt-dlp-plugins" | Out-Null
          }
          Get-ChildItem native-tools | Select-Object Name, Length

      # ── Stamp the version from the git tag ─────────────────────────
      # package.json version wins over the fallback; the tag is the source
      # of truth for release naming (same pattern as the APK job).
      - name: Stamp version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $version = $tag -replace '^v', ''
          if (-not $version) { $version = '0.0.0' }
          (Get-Content package.json -Raw) -replace '"version":\s*"[^"]+"', "`"version`": `"$version`"" | Set-Content package.json
          (Get-Content index.html -Raw) -replace '__VIDFETCH_BUILD__\s*=\s*"[^"]+"', "__VIDFETCH_BUILD__ = `"$tag`"" | Set-Content index.html
          Write-Host "Stamped package.json=$version index.html=$tag"

      - name: Build frontend
        run: npm run build

      - name: Generate icons
        run: npm run icon

      - name: Package EXE (NSIS + portable)
        # --publish never: the publish job below uploads ALL artifacts (APK +
        # EXEs) in one release. Without it electron-builder sees the v* tag and
        # tries to publish itself, which fails on the missing GH_TOKEN.
        run: npx electron-builder --config electron-builder.yml --win nsis portable --publish never
        env:
          # Skip code signing (no cert in this project)
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List release output
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name, Length

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: |
            release/VidFetch-Setup-*.exe
            release/VidFetch-*-portable.exe
          if-no-files-found: error

  # ── Create Release ─────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-apk, build-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version tag
        id: version
        run: |
          # Use input tag for manual dispatch, or git tag for push trigger
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $TAG"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./artifacts

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: release-exe
          path: ./artifacts

      - name: Rename APK with version
        id: rename
        run: |
          # The universal APK arrives as VidFetch.apk; stamp the version into
          # the name (VidFetch-v2.6.3.apk).
          VERSION="${{ steps.version.outputs.tag }}"
          mv ./artifacts/VidFetch.apk "./artifacts/VidFetch-${VERSION}.apk"
          # Stable-named copies so website links never change between
          # releases: releases/latest/download/VidFetch-latest.apk etc.
          cp "./artifacts/VidFetch-${VERSION}.apk" ./artifacts/VidFetch-latest.apk
          cp ./artifacts/VidFetch-Setup-*.exe ./artifacts/VidFetch-Setup-latest.exe
          cp ./artifacts/VidFetch-*-portable.exe ./artifacts/VidFetch-latest-portable.exe
          SHA=$(cat ./artifacts/SHA256.txt 2>/dev/null || echo "")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "✅ Renamed APK:"
          ls -la ./artifacts/*.apk
          echo "SHA-256: $SHA"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "VidFetch ${{ steps.version.outputs.tag }}"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ./artifacts/VidFetch-*.apk
            ./artifacts/VidFetch-Setup-*.exe
            ./artifacts/VidFetch-*-portable.exe
          body: |
            ## VidFetch ${{ steps.version.outputs.tag }}

            ### 📥 Downloads
            - **Android:** `VidFetch-*.apk` — ONE file for every device
              (arm64, arm32, x86_64; phones, tablets, emulators, Chromebooks).
              No need to figure out which build matches your phone.
              **Now signed** — install over any previous version without
              uninstalling.
            - **Windows installer:** `VidFetch-Setup-*.exe` — recommended
            - **Windows portable:** `VidFetch-*-portable.exe` — no install, single file

            The Windows EXE ships the full download engine (yt-dlp + ffmpeg),
            runs 100% on your PC (no server, no account) and is tuned for
            low RAM usage.

            ### 🔐 APK SHA-256
            Verify your download (optional): `shasum -a 256 VidFetch-*.apk`
            ```
            ${{ steps.rename.outputs.sha256 }}
            ```

            ### What's new
            See the commit history and release notes for details.

            ### Requirements
            - Android 8.0 (API 26) or higher, ~200 MB free storage (APK)
            - Windows 10/11 64-bit, ~200 MB free disk space (EXE)

            ### Install (Android)
            1. Download the APK below
            2. Allow "Install unknown apps" for your browser (Settings → Apps)
            3. Open the APK and confirm

            ### Install (Windows)
            1. Download `VidFetch-Setup-*.exe`
            2. Run it and follow the installer
            3. SmartScreen may warn about an unsigned app — click
               "More info" → "Run anyway"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
