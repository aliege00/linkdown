# ──────────────────────────────────────────────────────────────────────
# VidFetch — Manual Release Builder
#
# Trigger manually from the Actions tab.  Builds both APK + EXE,
# creates a GitHub Release, and uploads both as release assets.
#
# Usage:
#   1. Go to Actions → "Release Builder" → Run workflow
#   2. Enter the version tag (e.g. v1.2.0)
#   3. The release is created with both APK and EXE attached
# ──────────────────────────────────────────────────────────────────────

name: Release Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.2.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Android APK ────────────────────────────────────────────────────
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}

  # ── Windows EXE ────────────────────────────────────────────────────
  build-exe:
    name: Build EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - name: Build EXE
        run: npx electron-builder --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find EXE
        id: exe
        shell: bash
        run: |
          EXE=$(find dist_electron -name "*.exe" 2>/dev/null | head -1)
          echo "path=$EXE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-exe
          path: ${{ steps.exe.outputs.path }}

  # ── Create Release ─────────────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [build-apk, build-exe]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./artifacts

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: release-exe
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "VidFetch ${{ inputs.tag }}"
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            ./artifacts/**/*.apk
            ./artifacts/**/*.exe
          body: |
            ## VidFetch ${{ inputs.tag }}

            ### 📥 Downloads
            - **Android APK** — Install on Android 8.0+
            - **Windows EXE** — Portable, no installation needed

            ### What's new
            See the commit history for details.

            ### Requirements
            - Android: 8.0 (API 26) or higher, ~50 MB storage
            - Windows: 10 or higher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
