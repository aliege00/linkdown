# ──────────────────────────────────────────────────────────────────────
# VidFetch — Release Builder
#
# Triggers:
#   • Push a version tag (v*)  → auto-build + auto-release
#   • Manual (workflow_dispatch) → build + release with custom options
#
# ⚠️ This workflow ONLY builds Android APK.
#    There is NO Windows EXE / Electron build in this project.
# ──────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.7.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Android APK ────────────────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Android SDK ────────────────────────────────────────────────
      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME is set). The android-actions/setup-android@v3 action
      # is currently broken (it tries to install the deprecated "tools"
      # package and fails sdkmanager), so we only accept licenses here.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      # ── Stamp versionCode/versionName from the git tag ────────────
      # Android refuses to install an APK whose versionCode is not strictly
      # greater than the installed one. The repo had versionCode 1 pinned
      # through nine releases, so users could never update in place and kept
      # testing stale builds. Derive an ever-increasing code from the tag.
      - name: Stamp Android version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          # versionCode: major*10000 + minor*100 + patch (v2.3.2 -> 20302)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i "s/versionCode .*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION\"/" android/app/build.gradle
          echo "Stamped versionCode=$CODE versionName=$VERSION"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build frontend
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "✅ APK found: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}

  # ── Create Release ─────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version tag
        id: version
        run: |
          # Use input tag for manual dispatch, or git tag for push trigger
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $TAG"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./artifacts

      - name: Rename APK
        run: |
          APK=$(find ./artifacts -name "*.apk" | head -1)
          VERSION="${{ steps.version.outputs.tag }}"
          # Remove leading 'v' for filename: v1.7.0 → VidFetch-v1.7.0.apk
          mv "$APK" "./artifacts/VidFetch-${VERSION}.apk"
          echo "✅ Renamed to VidFetch-${VERSION}.apk"
          ls -la ./artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "VidFetch ${{ steps.version.outputs.tag }}"
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ./artifacts/VidFetch-*.apk
          body: |
            ## VidFetch ${{ steps.version.outputs.tag }}

            ### 📥 Download
            Grab the Android APK below and install it on your device.

            ### What's new
            See the commit history and release notes for details.

            ### Requirements
            - Android 8.0 (API 26) or higher
            - ~50 MB free storage

            ### Install
            1. Download the APK below
            2. Open it on your Android device
            3. Allow "Install from unknown sources" if prompted
            4. Done!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
