name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents:write lets the Prune step delete old artifacts and the rolling
# "ci-latest" release carry the actual downloads.
# NOTE: Release assets DO count toward the Actions storage quota on private
# repos.  The 500 MB GitHub Free limit covers artifacts + packages + release
# assets combined.  See GitHub Docs: about-billing-for-github-actions
permissions:
  contents: write
  actions: write

# Private repo: every runner minute is billed to the owner's monthly
# allowance (~12 min per full build set). Rapid successive pushes would
# stack up redundant runs - cancel superseded ones and save the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Cache disabled: npm cache consumes Actions storage (separate 10GB
          # pool) but on GitHub Free the shared artifact+packages pool is only
          # 500 MB.  Keeping cache off saves ~70 MB per run.
          cache: ''

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      # ── Quota guard ──────────────────────────────────────────────
      # Deletes artifacts from previous runs right before uploading, so a
      # full storage quota can never block the upload again. Placed AFTER
      # the build on purpose: if the build fails, nothing gets deleted.
      - name: Prune old artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate --jq '.artifacts[] | select(.expired == false) | .id' |
            while read -r id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done

      # ── Release distribution ───────────────────────────────────
      # Release assets count toward Actions storage.  To stay under the
      # 500 MB GitHub Free limit, only the EXE is published via Release
      # (see build-exe.yml).  The APK is available as an artifact with
      # a 3-day retention.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vidfetch-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          # Replace the previous artifact instead of accumulating one copy
          # per push — keeps account-level artifact storage usage flat.
          overwrite: true
          compression-level: 9
        # A full artifact-storage quota (recalculated every 6-12h) should not
        # fail an otherwise successful build; the next run will retry.
        continue-on-error: true
