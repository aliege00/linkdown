# ──────────────────────────────────────────────────────────────────────
# VidFetch — Android APK Build + Release
#
# Triggers:
#   • Push to main / develop  → build + upload artifact
#   • Push a version tag      → build + upload artifact + create GitHub Release
#
# ⚠️ This workflow ONLY builds Android APK.
#    There is NO Windows EXE / Electron build in this project.
# ──────────────────────────────────────────────────────────────────────

name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/tag
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Required for creating releases and uploading assets
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── Java (Gradle) ──────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Android SDK ────────────────────────────────────────────────
      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME is set). The android-actions/setup-android@v3 action
      # is currently broken (it tries to install the deprecated "tools"
      # package and fails sdkmanager), so we only accept licenses here.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ── Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Stamp versionCode/versionName from the git tag (if any) ───
      # See release.yml — Android requires a strictly increasing
      # versionCode for in-place APK updates.
      - name: Stamp Android version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          # Only stamp the defaultConfig line (`versionCode 20500`), never the
          # ABI-split override below (`variant.versionCode * 10 + abiCode`).
          sed -i "s/versionCode [0-9][0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "Stamped versionCode=$CODE versionName=$VERSION"

      # ── Frontend build ─────────────────────────────────────────────
      - name: Build frontend
        run: npm run build

      # ── Capacitor sync ─────────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── Build APK ──────────────────────────────────────────────────
      - name: Build split APKs (one per ABI — ~55% smaller downloads)
        working-directory: android
        run: ./gradlew assembleDebug

      # ── Find the APK ───────────────────────────────────────────────
      - name: Locate APK files
        id: apk
        run: |
          # ABI splits produce arm64-v8a / armeabi-v7a / x86_64 APKs — rename
          # them so users can pick the right one; arm64-v8a is the 99% case.
          mkdir -p apk-out
          i=0
          for f in android/app/build/outputs/apk/debug/*-*.apk; do
            [ -e "$f" ] || continue
            case "$f" in
              *arm64-v8a*)   NAME="VidFetch-arm64.apk" ;;
              *armeabi-v7a*) NAME="VidFetch-arm32.apk" ;;
              *x86_64*)      NAME="VidFetch-x86_64.apk" ;;
              *)             NAME="VidFetch-universal.apk" ;;
            esac
            cp "$f" "apk-out/$NAME"
            i=$((i+1))
            echo "Found: $NAME ($(du -h "$f" | cut -f1))"
          done
          if [ "$i" -eq 0 ]; then
            echo "❌ No APKs found!"
            exit 1
          fi
          echo "dir=apk-out" >> "$GITHUB_OUTPUT"
          echo "✅ $i split APKs ready"

      # ── Upload artifact (always) ───────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidfetch-${{ github.ref_name || 'debug' }}
          path: apk-out/*.apk
          retention-days: 14
          if-no-files-found: error

      # ── Create Release + Upload asset (tags only) ──────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "VidFetch ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apk-out/*.apk
          body: |
            ## VidFetch ${{ github.ref_name }}

            ### 📥 Download
            Grab the APK below and install it on your Android device.

            ### What's new
            See the commit history for details.

            ### Requirements
            - Android 8.0 (API 26) or higher
            - ~50 MB free storage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
