# ──────────────────────────────────────────────────────────────────────
# VidFetch — Android APK Build + Release
#
# Triggers:
#   • Push to main / develop  → build + upload artifact
#   • Push a version tag      → build + upload artifact + create GitHub Release
#
# The APK is ALWAYS uploaded as a build artifact so you can download it
# from the Actions tab.  When the trigger is a version tag (v*), the same
# APK is also attached as a release asset so users can find it on the
# Releases page.
# ──────────────────────────────────────────────────────────────────────

name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/tag
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Required for creating releases and uploading assets
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── Java (Gradle) ──────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Android SDK ────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # ── Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Frontend build ─────────────────────────────────────────────
      - name: Build frontend
        run: npm run build

      # ── Capacitor sync ─────────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── Build APK ──────────────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ── Find the APK ───────────────────────────────────────────────
      - name: Locate APK file
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          echo "✅ APK found: $APK_PATH"

      # ── Upload artifact (always) ───────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidfetch-${{ github.ref_name || 'debug' }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      # ── Create Release + Upload asset (tags only) ──────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "VidFetch ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## VidFetch ${{ github.ref_name }}

            ### 📥 Download
            Grab the APK below and install it on your Android device.

            ### What's new
            See the commit history for details.

            ### Requirements
            - Android 8.0 (API 26) or higher
            - ~50 MB free storage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
