name: Build Debug APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g., 1.0.0)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Version code (integer)"
        required: false
        default: "1"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          # Capacitor 8 requires Java 21 (capacitor.build.gradle sets
          # source/target compatibility to VERSION_21)
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || '' }}
          VITE_YTDLP_SERVER_URL: ${{ secrets.VITE_YTDLP_SERVER_URL || '' }}

      - name: Sync Capacitor
        run: npx cap sync android

            # Windows checkouts strip the executable bit from gradlew
      - name: Make gradlew executable
        run: chmod +x android/gradlew
        
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "VidFetch-v${VERSION}-debug-${COMMIT_HASH}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidFetch-Debug-APK
          path: VidFetch-*.apk
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Upload to Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VidFetch-*.apk
          generate_release_notes: true
          make_latest: true
