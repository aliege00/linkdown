# ──────────────────────────────────────────────────────────────────────
# VidFetch — Android APK Build + Release
#
# Triggers:
#   • Push to main / develop  → build + upload artifact
#   • Push a version tag      → build + upload artifact + create GitHub Release
#
# ⚠️ This workflow ONLY builds Android APK.
#    There is NO Windows EXE / Electron build in this project.
# ──────────────────────────────────────────────────────────────────────

name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/tag
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Required for creating releases and uploading assets
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── Java (Gradle) ──────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Android SDK ────────────────────────────────────────────────
      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME is set). The android-actions/setup-android@v3 action
      # is currently broken (it tries to install the deprecated "tools"
      # package and fails sdkmanager), so we only accept licenses here.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ── Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Stamp versionCode/versionName from the git tag (if any) ───
      # See release.yml — Android requires a strictly increasing
      # versionCode for in-place APK updates.
      - name: Stamp Android version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          # Only stamp the defaultConfig line (`versionCode 20500`), never
          # anything else. There is no ABI-split versionCode override anymore
          # (single universal APK).
          sed -i "s/versionCode [0-9][0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "Stamped versionCode=$CODE versionName=$VERSION"

      # ── Frontend build ─────────────────────────────────────────────
      - name: Build frontend
        run: npm run build

      # ── Capacitor sync ─────────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── Build APK ──────────────────────────────────────────────────
      # universalApk=true in build.gradle also emits per-ABI splits, but we
      # deliberately ship ONLY the universal APK: one file, installs on
      # every device, zero "which one do I download?" confusion.
      - name: Build single universal APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ── Find the APK ───────────────────────────────────────────────
      - name: Locate APK file
        id: apk
        run: |
          mkdir -p apk-out
          UNIVERSAL=$(ls android/app/build/outputs/apk/debug/*universal*.apk 2>/dev/null | head -n 1)
          if [ -z "$UNIVERSAL" ]; then
            echo "❌ Universal APK not found!"
            ls -la android/app/build/outputs/apk/debug/ || true
            exit 1
          fi
          cp "$UNIVERSAL" apk-out/VidFetch.apk
          echo "Found: VidFetch.apk ($(du -h "$UNIVERSAL" | cut -f1))"
          echo "dir=apk-out" >> "$GITHUB_OUTPUT"
          echo "✅ Single universal APK ready (arm64 + arm32 + x86_64)"

      # ── Upload artifact (always) ───────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidfetch-${{ github.ref_name || 'debug' }}
          path: apk-out/*.apk
          retention-days: 14
          if-no-files-found: error

      # ── Create Release + Upload asset (tags only) ──────────────────
      # Name the single APK with the version (tags only): VidFetch-v2.6.1.apk
      - name: Rename APK with version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mv apk-out/VidFetch.apk "apk-out/VidFetch-${VERSION}.apk"
          ls -la apk-out/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "VidFetch ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apk-out/VidFetch-*.apk
          body: |
            ## VidFetch ${{ github.ref_name }}

            ### 📥 Download
            Grab **VidFetch-*.apk** below — ONE file that works on every
            Android device (arm64, arm32, x86_64; emulators and Chromebooks
            included). No need to pick a version for your phone.

            ### What's new
            See the commit history for details.

            ### Requirements
            - Android 8.0 (API 26) or higher
            - ~200 MB free storage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
