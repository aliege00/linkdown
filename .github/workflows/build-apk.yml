name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# actions:write lets the Prune step delete old artifacts so the repo never
# hits the Actions storage quota again. contents:write lets the rolling
# "ci-latest" release carry the actual downloads - release assets do NOT
# count against the Actions artifact-storage quota.
permissions:
  contents: write
  actions: write

# Private repo: every runner minute is billed to the owner's monthly
# allowance (~12 min per full build set). Rapid successive pushes would
# stack up redundant runs - cancel superseded ones and save the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      # ── Quota guard ──────────────────────────────────────────────
      # Deletes artifacts from previous runs right before uploading, so a
      # full storage quota can never block the upload again. Placed AFTER
      # the build on purpose: if the build fails, nothing gets deleted.
      - name: Prune old artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate --jq '.artifacts[] | select(.expired == false) | .id' |
            while read -r id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done

      # ── Quota-proof distribution ────────────────────────────────
      # Release assets are not metered against the Actions storage quota,
      # so the APK stays downloadable even while artifact uploads are
      # blocked by a stale/recalculating account-level quota.
      - name: Publish to rolling "ci-latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-latest >/dev/null 2>&1 || \
            gh release create ci-latest --prerelease --title "Latest CI build" \
              --notes "Rolling automated build from main (${{ github.sha }})."
          cp android/app/build/outputs/apk/debug/app-debug.apk vidfetch-debug.apk
          gh release upload ci-latest vidfetch-debug.apk --clobber

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vidfetch-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          # Replace the previous artifact instead of accumulating one copy
          # per push — keeps account-level artifact storage usage flat.
          overwrite: true
        # A full artifact-storage quota (recalculated every 6-12h) should not
        # fail an otherwise successful build; the next run will retry.
        continue-on-error: true
