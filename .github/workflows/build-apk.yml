name: Build APK (Android)

# Runs automatically on every push to main, and manually via the
# "Run workflow" button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Sync Capacitor Android
        run: npx cap sync android

      # Required — without this the build fails with:
      #   ./gradlew: Permission denied
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # Copy the APK to a clear, versioned filename so the downloaded
      # artifact is self-explanatory (e.g. VidFetch-v1.0.0-android.apk).
      - name: Stage APK with clear name
        id: stage
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK file was produced by the build"
            exit 1
          fi
          mkdir -p staged-apk
          cp "$APK" "staged-apk/VidFetch-v${VERSION}-android.apk"
          echo "apk_file=staged-apk/VidFetch-v${VERSION}-android.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidFetch-Android-APK
          path: ${{ steps.stage.outputs.apk_file }}
          if-no-files-found: error
