# ──────────────────────────────────────────────────────────────────────
# VidFetch — Android APK Build + Release
#
# Triggers:
#   • Pull request to main    → typecheck + unit tests + DEBUG APK (pr-check job)
#   • Push to main / develop  → build + upload artifact
#   • Push a version tag      → build + upload artifact + create GitHub Release
#
# ⚠️ This workflow ONLY builds Android APK.
#    There is NO Windows EXE / Electron build in this project.
# ──────────────────────────────────────────────────────────────────────

name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/tag
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

# Required for creating releases and uploading assets
permissions:
  contents: write

jobs:
  # ── Pull-request gate ─────────────────────────────────────────────
  # A PR must be verifiable by anyone, including contributors who do not
  # have (and must never have) the release keystore. So PRs run the web
  # checks + a DEBUG-signed APK build: it compiles the Kotlin engine and
  # the Gradle/R8 config exactly like the release build, but it is never
  # uploaded to a Release — only as a CI artifact. The release job below
  # keeps its fail-fast secret check untouched.
  pr-check:
    name: PR checks (typecheck, tests, debug APK)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Debug signing only — no release keystore, no release artifact.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vidfetch-pr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build Android APK
    # Release/main builds only — see pr-check above for why PRs are excluded.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── Java (Gradle) ──────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ── Android SDK ────────────────────────────────────────────────
      # ubuntu-latest runners ship with the Android SDK preinstalled
      # (ANDROID_HOME is set). The android-actions/setup-android@v3 action
      # is currently broken (it tries to install the deprecated "tools"
      # package and fails sdkmanager), so we only accept licenses here.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # ── Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Release signing keystore (from GitHub Secrets) ────────────
      # Same injection as release.yml. Fails fast when the secret is
      # missing so PRs can't silently ship debug-signed APKs.
      - name: Decode signing keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            cat >&2 <<'MSG'
          ❌ Signing secrets missing — this is the release job refusing to ship a
             debug-signed APK. It fails on purpose, every time, until the four
             secrets exist.

          Fastest fix (one command on your own machine, needs JDK + gh CLI):
             git clone https://github.com/aliege00/linkdown && cd linkdown
             npm run setup:signing

          It generates the keystore with keytool, uploads all four secrets and
          verifies them. Then re-run: gh workflow run build-apk.yml --ref main

          Doing it by hand:
             keytool -genkeypair -v -keystore release.keystore -alias vidfetch \
               -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12
             gh secret set SIGNING_KEY            -R aliege00/linkdown -b "$(base64 -w0 release.keystore)"
             gh secret set SIGNING_STORE_PASSWORD -R aliege00/linkdown
             gh secret set SIGNING_KEY_ALIAS      -R aliege00/linkdown -b vidfetch
             gh secret set SIGNING_KEY_PASSWORD   -R aliege00/linkdown

          NOTE: the CI identity that opens pull requests cannot read or write
          Actions secrets, so this step has to be run by a repo admin.
          MSG
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 --decode > android/app/release.keystore
          echo "SIGNING_STORE_FILE=$PWD/android/app/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      # ── Stamp versionCode/versionName from the git tag (if any) ───
      # See release.yml — Android requires a strictly increasing
      # versionCode for in-place APK updates.
      - name: Stamp Android version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          # Only stamp the defaultConfig line (`versionCode 20500`), never
          # anything else. There is no ABI-split versionCode override anymore
          # (single universal APK).
          sed -i "s/versionCode [0-9][0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "Stamped versionCode=$CODE versionName=$VERSION"

      # ── Frontend build ─────────────────────────────────────────────
      - name: Build frontend
        run: npm run build

      # ── Capacitor sync ─────────────────────────────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── Build APK ──────────────────────────────────────────────────
      # universalApk=true in build.gradle also emits per-ABI splits, but we
      # deliberately ship ONLY the universal APK: one file, installs on
      # every device, zero "which one do I download?" confusion.
      - name: Build single universal release APK
        working-directory: android
        run: ./gradlew assembleRelease

      # ── Find the APK ───────────────────────────────────────────────
      - name: Locate APK file
        id: apk
        run: |
          mkdir -p apk-out
          UNIVERSAL=$(ls android/app/build/outputs/apk/release/*universal*.apk 2>/dev/null | head -n 1)
          if [ -z "$UNIVERSAL" ]; then
            echo "❌ Universal release APK not found!"
            ls -la android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          cp "$UNIVERSAL" apk-out/VidFetch.apk
          echo "Found: VidFetch.apk ($(du -h "$UNIVERSAL" | cut -f1))"
          echo "✅ Single universal SIGNED release APK ready (arm64 + arm32 + x86_64)"

      # ── Upload artifact (always)───────────────────────────────────
      - name: Compute APK SHA-256
        run: |
          SHA=$(sha256sum apk-out/VidFetch.apk | awk '{print $1}')
          echo "$SHA" > apk-out/SHA256.txt
          echo "SHA-256: $SHA"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vidfetch-${{ github.ref_name || 'debug' }}
          path: |
            apk-out/*.apk
            apk-out/SHA256.txt
          retention-days: 14
          if-no-files-found: error

      # ── Create Release + Upload asset (tags only) ──────────────────
      # Versioned + stable-latest names; SHA-256 goes into the release notes.
      - name: Rename APK with version
        id: rename
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          SHA=$(cat apk-out/SHA256.txt 2>/dev/null || sha256sum apk-out/VidFetch.apk | awk '{print $1}')
          mv apk-out/VidFetch.apk "apk-out/VidFetch-${VERSION}.apk"
          cp "apk-out/VidFetch-${VERSION}.apk" apk-out/VidFetch-latest.apk
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          ls -la apk-out/
          echo "SHA-256: $SHA"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "VidFetch ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: apk-out/VidFetch-*.apk
          body: |
            ## VidFetch ${{ github.ref_name }}

            ### 📥 Download
            - **Android:** `VidFetch-${{ github.ref_name }}.apk` — ONE file for
              every device (arm64, arm32, x86_64; emulators and Chromebooks
              included). **Signed release APK** — installs over any previous
              version without uninstalling.
            - Always-newest link:
              https://github.com/aliege00/linkdown/releases/latest/download/VidFetch-latest.apk

            ### 🔐 APK SHA-256
            Verify your download (optional): `shasum -a 256 VidFetch-*.apk`
            ```
            ${{ steps.rename.outputs.sha256 }}
            ```

            ### What's new
            See the commit history for details.

            ### Install (Android)
            1. Download the APK below
            2. Allow "Install unknown apps" for your browser (Settings → Apps)
            3. Open the APK and confirm

            ### Requirements
            - Android 8.0 (API 26) or higher
            - ~200 MB free storage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
