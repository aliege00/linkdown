name: Build Portable EXE (PWABuilder)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g., 1.0.0)"
        required: false
        default: "1.0.0"

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || '' }}
          VITE_YTDLP_SERVER_URL: ${{ secrets.VITE_YTDLP_SERVER_URL || '' }}

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/pwabuilder-cli

      - name: Generate Windows EXE with PWABuilder
        run: |
          # Serve the built app and generate Windows package
          npx pwabuilder package --platform windows --file dist --out pwabuild-output

      - name: List generated files
        run: |
          Get-ChildItem -Path pwabuild-output -Recurse | Select-Object FullName, Length
        shell: pwsh

      - name: Rename and organize EXE
        run: |
          $VERSION = "${{ github.event.inputs.version_name || '1.0.0' }}"
          $COMMIT = (git rev-parse --short HEAD)
          $EXT = "msix"  # PWABuilder typically generates .msix/.msixbundle
          if (Test-Path "pwabuild-output/*.exe") { $EXT = "exe" }
          if (Test-Path "pwabuild-output/*.msix") { $EXT = "msix" }
          Get-ChildItem -Path pwabuild-output | ForEach-Object {
            $newName = "VidFetch-v${VERSION}-windows-${COMMIT}.${EXT}"
            Move-Item $_.FullName -Destination $newName -Force
          }
        shell: pwsh

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidFetch-Windows-EXE
          path: VidFetch-*.exe
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: Upload MSIX artifact (fallback)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VidFetch-Windows-MSIX
          path: VidFetch-*.msix
          retention-days: 30

      - name: Upload to Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VidFetch-*.exe
            VidFetch-*.msix
          generate_release_notes: true
          make_latest: false
