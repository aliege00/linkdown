name: Build Portable EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

# actions:write lets the Prune step delete old artifacts so the repo never
# hits the Actions storage quota again.
permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app + EXE
        # Uses electron-builder with the repo's electron-builder.yml
        # (see the "build:exe" script in package.json).
        run: npm run build:exe

      # ── Quota guard ──────────────────────────────────────────────
      # Deletes artifacts from previous runs right before uploading, so a
      # full storage quota can never block the upload again. Placed AFTER
      # the build on purpose: if the build fails, nothing gets deleted.
      - name: Prune old artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate --jq '.artifacts[] | select(.expired == false) | .id' |
            while read -r id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: vidfetch-windows-exe
          path: dist/*.exe
          retention-days: 3
