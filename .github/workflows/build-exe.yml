# ──────────────────────────────────────────────────────────────────────
# VidFetch — Windows EXE Build + Release
#
# Triggers:
#   • Push to main / develop  → build + upload artifact
#   • Push a version tag      → build + upload artifact + create GitHub Release
# ──────────────────────────────────────────────────────────────────────

name: Build EXE

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build EXE
        run: npx electron-builder --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate EXE
        id: exe
        shell: bash
        run: |
          EXE_PATH=$(find dist_electron -name "*.exe" 2>/dev/null | head -1)
          if [ -z "$EXE_PATH" ]; then
            echo "❌ No EXE found!"
            exit 1
          fi
          echo "path=$EXE_PATH" >> "$GITHUB_OUTPUT"
          echo "filename=$(basename "$EXE_PATH")" >> "$GITHUB_OUTPUT"
          echo "✅ EXE found: $EXE_PATH"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: vidfetch-exe-${{ github.ref_name || 'debug' }}
          path: ${{ steps.exe.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload EXE to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.exe.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
