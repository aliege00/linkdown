name: Build Portable EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g., 1.0.0)"
        required: false
        default: "1.0.0"

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || '' }}
          VITE_YTDLP_SERVER_URL: ${{ secrets.VITE_YTDLP_SERVER_URL || '' }}

      # Download the real download engine (yt-dlp + ffmpeg) so the EXE can
      # actually download videos, exactly like the Android app.
      - name: Download yt-dlp & ffmpeg engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native-tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "native-tools/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-tmp -Force
          Copy-Item (Get-ChildItem -Path "ffmpeg-tmp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).FullName "native-tools/ffmpeg.exe"
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg-tmp
          Get-ChildItem native-tools | Select-Object Name, Length

      # Package the built web app into a portable Windows EXE using
      # Electron + electron-builder. Output goes to pwabuild-output/.
      - name: Package portable EXE with Electron
        run: npx --yes electron-builder@26.15.3 --config electron-builder.yml
        shell: pwsh

      - name: Rename generated package
        shell: pwsh
        run: |
          if (Test-Path pwabuild-output) {
            $VERSION = "${{ github.event.inputs.version_name || '1.0.0' }}"
            $COMMIT = (git rev-parse --short HEAD)
            $index = 1
            Get-ChildItem -Path pwabuild-output -File | ForEach-Object {
              $ext = $_.Extension.TrimStart('.')
              $newName = "VidFetch-v${VERSION}-windows-${COMMIT}-${index}.${ext}"
              Move-Item $_.FullName -Destination $newName -Force
              Write-Host "Renamed to $newName"
              $index++
            }
          } else {
            Write-Error "pwabuild-output not found — electron-builder step failed"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidFetch-Windows
          path: VidFetch-*
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: Upload to Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VidFetch-*
          generate_release_notes: true
          make_latest: false
