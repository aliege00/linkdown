name: Build Portable EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

# contents:write lets the Prune step delete old artifacts and the rolling
# "ci-latest" release carry the actual downloads.
# NOTE: Release assets DO count toward the 500 MB Actions storage quota on
# private repos.  See GitHub Docs: about-billing-for-github-actions
permissions:
  contents: write
  actions: write

# Private repo: every runner minute is billed to the owner's monthly
# allowance (~12 min per full build set). Rapid successive pushes would
# stack up redundant runs - cancel superseded ones and save the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Cache disabled: npm cache consumes Actions storage.  On GitHub Free
          # the shared limit is only 500 MB — skip cache to stay well under.
          cache: ''

      - name: Install dependencies
        run: npm ci

      - name: Build web app + EXE
        # Uses electron-builder with the repo's electron-builder.yml
        # (see the "build:exe" script in package.json).
        run: npm run build:exe

      # ── Quota guard ──────────────────────────────────────────────
      # Deletes artifacts from previous runs right before uploading, so a
      # full storage quota can never block the upload again. Placed AFTER
      # the build on purpose: if the build fails, nothing gets deleted.
      - name: Prune old artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --paginate --jq '.artifacts[] | select(.expired == false) | .id' |
            while read -r id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done

      # ── Release distribution ───────────────────────────────────
      # Only the EXE is published to Releases (106 MB) to stay under the
      # 500 MB GitHub Free storage limit.  The APK is available as an
      # artifact with 1-day retention.  If both must be on Releases,
      # consider making the repo public (unlimited storage).
      - name: Publish to rolling "ci-latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-latest >/dev/null 2>&1 || \
            gh release create ci-latest --prerelease --title "Latest CI build" \
              --notes "Rolling automated build from main (${{ github.sha }})." || \
            echo "release created concurrently - continuing"
          # electron-builder outputs to pwabuild-output (see electron-builder.yml),
          # NOT dist/ which holds the Vite web bundle.
          exe=$(ls pwabuild-output/*.exe | head -1)
          cp "$exe" vidfetch-windows-portable.exe
          gh release upload ci-latest vidfetch-windows-portable.exe --clobber

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: vidfetch-windows-exe
          path: pwabuild-output/*.exe
          retention-days: 1
          # Replace the previous artifact instead of accumulating one copy
          # per push — keeps account-level artifact storage usage flat.
          overwrite: true
          compression-level: 9
        # A full artifact-storage quota (recalculated every 6-12h) should not
        # fail an otherwise successful build; the next run will retry.
        continue-on-error: true
