name: Build Portable EXE (PWABuilder)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g., 1.0.0)"
        required: false
        default: "1.0.0"

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || '' }}
          VITE_YTDLP_SERVER_URL: ${{ secrets.VITE_YTDLP_SERVER_URL || '' }}

      # The PWABuilder CLI is published on npm as "pwabuilder".
      # npx runs it on the fly — no global install needed.
      - name: Generate Windows package with PWABuilder
        run: npx -y pwabuilder package --platform windows --file dist --out pwabuild-output
        shell: pwsh

      - name: Rename generated package
        run: |
          $VERSION = "${{ github.event.inputs.version_name || '1.0.0' }}"
          $COMMIT = (git rev-parse --short HEAD)
          $index = 1
          Get-ChildItem -Path pwabuild-output -File | ForEach-Object {
            $ext = $_.Extension.TrimStart('.')
            $newName = "VidFetch-v${VERSION}-windows-${COMMIT}-${index}.${ext}"
            Move-Item $_.FullName -Destination $newName -Force
            Write-Host "Renamed to $newName"
            $index++
          }
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidFetch-Windows
          path: VidFetch-*
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn

      - name: Upload to Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VidFetch-*
          generate_release_notes: true
          make_latest: false
