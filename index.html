<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Primary Meta Tags -->
  <meta name="title" content="VidFetch - Free Video Downloader" />
  <meta name="description" content="Free video downloader. Paste any video link and download instantly. No sign-ups, no limits." />

  <!-- PWA / Android -->
  <meta name="theme-color" content="#4a7aff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="VidFetch" />

  <!-- iOS / Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VidFetch" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="apple-touch-startup-image" href="/icon-512.png" />

  <!-- Windows / IE -->
  <meta name="msapplication-TileColor" content="#4a7aff" />
  <meta name="msapplication-TileImage" content="/icon-192.png" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VidFetch - Free Video Downloader</title>

  <script>
    // Register service worker if supported
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          // Service worker registration failed — non-critical
        });
      });
    }
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
